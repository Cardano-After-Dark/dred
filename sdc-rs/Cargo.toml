[package]
name = "sdc-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.12", features = ["stream", "json"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"
nanoid = "0.4"
dryoc = "0.7"
base64 = "0.22"

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
